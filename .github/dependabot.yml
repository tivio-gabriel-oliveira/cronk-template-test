version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/.github/workflows/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
