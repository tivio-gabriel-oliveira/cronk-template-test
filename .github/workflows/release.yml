name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.15"

      - name: Confirm tag name matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep "version = .*" pyproject.toml | sed -E 's/.*"(.*)"/\1/')
          [ "v$VERSION" = "$TAG" ] || exit 1

      - name: Build package
        run: |
          pip install -r .github/workflows/requirements/build.txt --require-hashes
          python -m build --no-isolation

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: ./dist/
          if-no-files-found: error

      - name: Generate hashes for provenance
        id: hashes
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    name: Generate SLSA Level 3 provenance
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      actions: read
      id-token: write
      contents: write

    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      provenance-name: provenance-cronk-${{ github.ref_name }}.intoto.jsonl
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true

  github-release:
    name: Upload distributions to GitHub Release
    runs-on: ubuntu-latest
    needs: [provenance]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@cc34169542a2512f458e0a3591f86f776269df73 # v4.1.8
        with:
          name: dist
          path: ./dist/

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@da05d556f626d3fb016e9960193796d849474e64 # v2.6.2
        with:
          files: dist/*

  pypi-release:
    name: Publish to TestPyPI via OIDC
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@cc34169542a2512f458e0a3591f86f776269df73 # v4.1.8
        with:
          name: dist
          path: ./dist/

      - name: Confirm artifacts integrity
        run: |
          cd dist
          echo "${{ needs.build.outputs.hashes }}" | base64 --decode | sha256sum --check --status

      - name: Publish to TestPyPI via OIDC
        if: vars.ENABLE_PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@f8c70e705ffc13c3b4d1221169b84f12a75d6ca8 # v1.8.8
        with:
          repository-url: https://test.pypi.org/legacy/
